[project]
name = "eval-lab"
version = "0.1.0"
description = "W1 地基：多 provider 调用封装 + 调用落库 + 故障复现"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "markdown>=3.11.3",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
]

[project.scripts]
eval-lab = "eval_lab.cli:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
